name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Secret is base64 of the OpenSSH private key (avoids paste/newline breakage)
          printf '%s' "$OCI_SSH_KEY" | base64 -d > ~/.ssh/oci_deploy
          chmod 600 ~/.ssh/oci_deploy
          ssh-keygen -lf ~/.ssh/oci_deploy
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts
          # Quick auth check before rsync
          ssh -i ~/.ssh/oci_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.OCI_USER }}@${OCI_HOST}" "echo ssh_ok"

      - name: Upload dist + deploy script
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/oci_deploy -o IdentitiesOnly=yes" \
            dist/ "${OCI_USER}@${OCI_HOST}:/home/ubuntu/Billifi/dist/"
          rsync -az \
            -e "ssh -i ~/.ssh/oci_deploy -o IdentitiesOnly=yes" \
            scripts/oci-remote-deploy.sh "${OCI_USER}@${OCI_HOST}:/home/ubuntu/Billifi/scripts/oci-remote-deploy.sh"

      - name: Pull code & restart on server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/oci_deploy -o IdentitiesOnly=yes \
            "${OCI_USER}@${OCI_HOST}" \
            "chmod +x /home/ubuntu/Billifi/scripts/oci-remote-deploy.sh && bash /home/ubuntu/Billifi/scripts/oci-remote-deploy.sh"
